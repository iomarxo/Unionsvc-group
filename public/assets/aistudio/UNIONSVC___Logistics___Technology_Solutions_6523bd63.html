<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNIONSVC — Logistics & Technology Solutions</title>
<meta name="description" content="Unionsvc connects logistics operations with practical technology-driven solutions.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F7F4EC;--sand:#EEE7DA;--champ:#D6B36A;--gold:#B99348;--char:#222;--black:#151515;--gray:#77746D;--white:#fff;--serif:"Cormorant Garamond","Playfair Display",Georgia,serif;--sans:Inter,Manrope,system-ui,sans-serif;
--t-pt:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px;height:auto}
body{font-family:var(--sans);background:var(--ivory);color:var(--char);line-height:1.65;overflow-x:hidden;padding-top:var(--t-pt)}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea,[dir=rtl] button{font-family:Cairo,var(--sans)}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:Cairo,var(--serif);font-weight:600}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:auto;padding:0 24px}
.eyebrow{font-size:.72rem;letter-spacing:.2em;color:var(--gold);margin-bottom:12px}
[dir=rtl] .eyebrow{letter-spacing:0;font-size:.85rem}
h2{font-size:clamp(2rem,4vw,2.9rem);margin-bottom:16px}
section{padding:84px 0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:40px;border:1px solid var(--gold);font-size:.9rem;cursor:pointer;transition:.25s;background:none;color:inherit;font-family:inherit}
.btn.gold{background:linear-gradient(135deg,var(--champ),var(--gold));color:var(--black);border-color:transparent}
.btn:hover{box-shadow:0 0 0 3px rgba(214,179,106,.25)}
.arr{display:inline-block}[dir=rtl] .arr{transform:scaleX(-1)}
/* header */
header{position:fixed;top:0;inset-inline:0;z-index:50;padding-top:var(--t-pt);transition:.3s;color:#fff}
header.solid{background:rgba(21,21,21,.92);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold)}
.logo b{font-family:var(--serif);letter-spacing:.15em;font-size:1.1rem;color:var(--champ)}
nav ul{display:flex;gap:30px;list-style:none;padding:0}
nav a{font-size:.88rem;padding:6px 0;border-bottom:1px solid transparent;transition:.25s;opacity:.88}
nav a:hover,nav a.on{border-color:var(--champ);color:var(--champ);opacity:1}
.tools{display:flex;align-items:center;gap:14px;font-size:.85rem}
.lang button{background:none;border:0;color:inherit;cursor:pointer;opacity:.6;font:inherit;padding:4px}
.lang button.on{opacity:1;color:var(--champ)}
.burger{display:none;background:none;border:1px solid var(--gold);color:#fff;border-radius:8px;width:42px;height:42px;font-size:1.2rem;cursor:pointer}

.hero svg{position:absolute;inset:auto 0 0 0;width:100%;height:58%;opacity:.95}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(21,21,21,.78),rgba(21,21,21,.1) 70%);z-index:1}
[dir=rtl] .hero:before{background:linear-gradient(270deg,rgba(21,21,21,.78),rgba(21,21,21,.1) 70%)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.6rem);max-width:640px}
.hero h1 span{display:block;color:var(--champ)}
.hero p{max-width:480px;margin:22px 0 32px;opacity:.92}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.hero .btn:not(.gold){border-color:rgba(255,255,255,.55)}
/* about */
.about{background:linear-gradient(var(--ivory),var(--sand))}
.grid3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:44px;align-items:center}
.panel{aspect-ratio:4/3;border-radius:14px;border:1px solid var(--gold);background:#151515;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.panel i{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--gold),transparent)}
.panel .map{flex:1;border-radius:8px;background:radial-gradient(circle at 30% 40%,rgba(214,179,106,.5) 0 3px,transparent 4px),radial-gradient(circle at 62% 55%,rgba(214,179,106,.5) 0 3px,transparent 4px),radial-gradient(circle at 78% 30%,rgba(214,179,106,.5) 0 3px,transparent 4px),#222}
.pts{display:grid;gap:22px}
.pt{display:flex;gap:14px}
.ic{flex:none;width:48px;height:48px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pt h3,.card h3{font-size:1.2rem;font-family:var(--sans);font-weight:500;margin-bottom:4px}
[dir=rtl] .pt h3,[dir=rtl] .card h3{font-family:Cairo}
.pt p,.card p,.why p{font-size:.88rem;color:var(--gray)}
.frame{margin:0;padding:8px;border:1px solid var(--gold);border-radius:18px;background:var(--ivory);box-shadow:0 18px 40px rgba(0,0,0,.18)}
.frame img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px}
.shot{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid var(--gold);box-shadow:0 18px 40px rgba(0,0,0,.18)}
@media(max-width:560px){.hero{background-position:70% center}}
/* services */
.services{background:var(--sand)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:36px}
.card{background:var(--ivory);border:1px solid rgba(185,147,72,.55);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(34,34,34,.12)}

.cgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:40px}
.contact p{color:#cfcabf}
.mail{display:flex;align-items:center;gap:14px;margin:26px 0}
.mail a{color:var(--champ)}
form{border:1px solid rgba(214,179,106,.5);border-radius:16px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:#cfcabf}
.f.full{grid-column:1/-1}
input,select,textarea{background:#151515;border:1px solid #4a463d;border-radius:8px;color:#fff;padding:11px 12px;font:inherit;font-size:.9rem;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--champ)}
.err{color:#e8a08a;font-size:.74rem;min-height:1em}
.bad{border-color:#e8a08a}
#msg{grid-column:1/-1;font-size:.85rem;color:var(--champ)}
/* faq */
.faq{margin-top:56px;display:grid;grid-template-columns:1fr 1.4fr;gap:40px}
.faq details{border-bottom:1px solid rgba(214,179,106,.35)}
.faq summary{list-style:none;cursor:pointer;padding:15px 0;display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";color:var(--champ);font-size:1.3rem;line-height:1}
.faq details[open] summary:after{content:"−"}
.faq details[open] summary{color:var(--champ)}
.ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
details[open] .ans{grid-template-rows:1fr}
.ans div{overflow:hidden;color:#cfcabf;font-size:.9rem}
.ans div p{padding-bottom:16px}
/* footer */
footer{background:var(--black);color:#cfcabf;padding:48px 0 28px;border-top:1px solid rgba(214,179,106,.4);font-size:.88rem}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:30px}
footer h4{color:var(--champ);font-weight:500;margin-bottom:10px;font-size:.9rem}
footer ul{list-style:none;padding:0;display:grid;gap:6px}
footer a:hover{color:var(--champ)}
.copy{margin-top:30px;padding-top:18px;border-top:1px solid #333;text-align:center;font-size:.8rem}
.rv{opacity:0;transform:translateY(14px);transition:.7s}
.rv.in{opacity:1;transform:none}
@media(max-width:960px){
.cards,.why4{grid-template-columns:1fr 1fr;gap:26px 20px}.why:nth-child(odd){border:0;padding-inline-start:0}
.grid3,.cgrid,.faq,.fg{grid-template-columns:1fr}
nav{position:fixed;inset:calc(72px + var(--t-pt)) 0 auto 0;background:rgba(21,21,21,.97);max-height:0;overflow:hidden;transition:max-height .35s}
nav.open{max-height:380px}nav ul{flex-direction:column;padding:18px 24px;gap:14px}
.burger{display:block}.tools .btn{display:none}}
@media(max-width:560px){.cards,.why4{grid-template-columns:1fr}.why{border:0;padding:0}form{grid-template-columns:1fr}section{padding:60px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
